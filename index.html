<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved choice before styles load and React mounts.
      try {
        const theme = localStorage.getItem('npm-stats-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch {
        // Follow the system when browser storage is unavailable.
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NPM Stats | Package & Author Download Analytics</title>
    <meta
      name="description"
      content="Search total npm download statistics for packages and explore author package rankings with combined download counts."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
